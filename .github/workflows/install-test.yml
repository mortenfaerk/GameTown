name: Install test

# Proves the installer actually installs, which "the workflow produced a tarball" does not.
#
# Runs directly on the runner VM rather than in a debian:12 container. The runner has real systemd at
# PID 1, so the unit is exercised exactly as written -- Type=notify, PrivateTmp, ProtectHome and all.
# Getting that inside a container needs --privileged plus a cgroup mount and systemd as the
# entrypoint, and even then PrivateTmp and the notify socket are the parts most likely to behave
# differently. The runner is ephemeral, so installing to /opt and /var/lib on it costs nothing.
#
# It must be a SYSTEM unit. A --user unit would fail here for a reason that does not exist in
# production: ProtectHome=true makes /run/user inaccessible, and a user unit's notify socket lives at
# /run/user/$UID/systemd/notify. System units use /run/systemd/notify and are unaffected.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  install-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(dotnet msbuild API/API.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Built and packaged exactly as release.yml does it, so this tests the artifact that would
      # actually ship rather than an approximation of it.
      - name: Build the release artifact
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          dotnet publish API \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            --output publish

          mkdir -p dist
          tar czf "dist/gametown-$TAG-linux-x64.tar.gz" -C publish .
          ( cd dist && sha256sum "gametown-$TAG-linux-x64.tar.gz" > SHA256SUMS )

      # install.sh normally fetches from GitHub Releases, which do not exist for an unmerged commit.
      # GAMETOWN_BASE_URL points it at the artifact just built instead -- otherwise the installer
      # could only ever be tested after it had already shipped.
      - name: Serve the artifact locally
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8000 --directory dist >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/SHA256SUMS && exit 0
            sleep 0.5
          done
          echo "::error::the local artifact server never came up"; exit 1

      - name: Install (fresh)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          sudo GAMETOWN_BASE_URL=http://127.0.0.1:8000 GAMETOWN_VERSION="$TAG" bash install.sh

      # `systemctl start` inside install.sh only returns once systemd has the readiness notification,
      # so reaching this step at all is already proof the Type=notify handshake works. A broken one
      # blocks for the 90s timeout and fails the step above.
      - name: Verify the service came up
        run: |
          set -euo pipefail
          systemctl is-active --quiet gametown || { sudo journalctl -u gametown -n 50 --no-pager; exit 1; }
          systemctl is-enabled --quiet gametown

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:5187/setup; then
              echo "the first-run wizard is serving"; break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:5187/setup \
            || { sudo journalctl -u gametown -n 50 --no-pager; exit 1; }

      # The application creates its own schema on first start; nothing in install.sh does it any more.
      # If that regressed, the database would be missing or empty here.
      - name: Verify the app created its own database
        run: |
          set -euo pipefail
          sudo test -f /var/lib/gametown/gametown.db
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends sqlite3 >/dev/null
          version="$(sudo sqlite3 /var/lib/gametown/gametown.db 'SELECT MAX("Version") FROM "SchemaVersion"')"
          roles="$(sudo sqlite3 /var/lib/gametown/gametown.db 'SELECT COUNT(*) FROM "GameTownRoles"')"
          echo "schema version=$version roles=$roles"
          [[ "$version" -ge 7 ]] || { echo "::error::schema did not migrate past the baseline"; exit 1; }
          [[ "$roles" -eq 2 ]]   || { echo "::error::roles were not seeded"; exit 1; }

      # Turns the install just made into one from an OLDER release, so the next step is a genuine
      # schema upgrade rather than a re-run over a database that is already current.
      #
      # This is the gap this workflow used to have. Both install.sh runs used the same build, so the
      # migrations had already been applied by the first one and the "upgrade" exercised nothing but
      # file copying -- the one thing an operator actually risks, taking a new build over a populated
      # older database, was never tested here at all.
      #
      # Version 3 is the shape of a v0.1.1 install: archive hashes, no box art and no tags. The
      # objects added by 004 and 005 are removed by hand and the version rows rolled back to match,
      # which is as close to a real older install as this can get without keeping an old artifact
      # around. NB the schema and the version rows must be rolled back TOGETHER -- 004 is a bare
      # ALTER TABLE ADD COLUMN and SQLite has no "IF NOT EXISTS" for it, so a database whose
      # SchemaVersion disagrees with its own schema fails to start.
      - name: Roll the install back to the previous schema version, with a library in it
        run: |
          set -euo pipefail

          # Nothing may hold the database open while it is rewritten.
          sudo systemctl stop gametown

          # A real library entry, carrying the fields the migrations must not disturb. The GUID
          # literal is uppercase because EF writes them that way and SQLite compares TEXT binary.
          sudo sqlite3 /var/lib/gametown/gametown.db <<'SQL'
            INSERT INTO "GameTownGame" ("Id","Title","HowTo","RAWGGameId","URL","Size","ArchiveSha256")
            VALUES ('11111111-1111-1111-1111-111111111111','Existing Game','Unzip it',NULL,
                    '/var/lib/gametown/games/library-marker.zip', 1234.5, 'abc123');

            -- A game WITH RAWG metadata, which is what migration 007 has to carry across. Its
            -- images are local /media paths because that is what a real install holds: every
            -- image was downloaded onto this server when it was imported, which is the whole
            -- reason the upgrade needs no network and survives RAWG being gone.
            INSERT INTO "RAWGGames" ("id","slug","name","description","website","metacritic","rating",
                                     "background_image","released")
            VALUES (3498,'gta-v','Grand Theft Auto V','<p>An open world game.</p>',
                    'https://rockstargames.com',92,4.47,'/media/cover-3498.jpg','2013-09-17');
            INSERT INTO "RAWGGenres" ("id","name","slug") VALUES (4,'Action','action');
            INSERT INTO "RAWGGames_Genres" VALUES (3498,4);
            INSERT INTO "GameTownGame" ("Id","Title","HowTo","RAWGGameId","URL","Size")
            VALUES ('22222222-2222-2222-2222-222222222222','Metadata Game','Run it',3498,
                    '/var/lib/gametown/games/meta-marker.zip', 42.0);

            DROP TABLE IF EXISTS "MetadataGames_Screenshots";
            DROP TABLE IF EXISTS "MetadataGames_Genres";
            DROP TABLE IF EXISTS "MetadataGames_Developers";
            DROP TABLE IF EXISTS "MetadataScreenshots";
            DROP TABLE IF EXISTS "MetadataGenres";
            DROP TABLE IF EXISTS "MetadataDevelopers";
            DROP TABLE IF EXISTS "MetadataGames";
            DROP TABLE IF EXISTS "GameTownGame_Tags";
            DROP TABLE IF EXISTS "Tags";
            -- The index must go BEFORE the column: SQLite's DROP COLUMN refuses a column an index
            -- references (the column-level REFERENCES does not block it, the index does).
            DROP INDEX IF EXISTS "IX_GameTownGame_MetadataId";
            ALTER TABLE "GameTownGame" DROP COLUMN "MetadataId";
            ALTER TABLE "GameTownGame" DROP COLUMN "BoxArtUrl";
            ALTER TABLE "GameTownGame" DROP COLUMN "GuideBaked";
            DELETE FROM "SchemaVersion" WHERE "Version" > 3;
          SQL

          version="$(sudo sqlite3 /var/lib/gametown/gametown.db 'SELECT MAX("Version") FROM "SchemaVersion"')"
          [[ "$version" -eq 3 ]] || { echo "::error::rollback did not reach version 3 (got $version)"; exit 1; }

      # A marker in the data directory, to prove the upgrade below preserves a real library rather
      # than merely completing without error.
      - name: Leave data behind, then upgrade over it
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "precious" | sudo tee /var/lib/gametown/games/library-marker.zip >/dev/null
          echo "precious" | sudo tee /var/lib/gametown/games/meta-marker.zip >/dev/null

          # A stand-in for re-hosted cover art. The migration moves the PATH to this file between
          # tables; if it ever moved or rewrote the file itself, every cover in a real library would
          # go blank on upgrade and nothing else here would notice.
          sudo mkdir -p /var/lib/gametown/media
          echo "notreallyajpeg" | sudo tee /var/lib/gametown/media/cover-3498.jpg >/dev/null

          # GAMETOWN_FORCE, because the version has not changed -- this is exercising the upgrade
          # path, not the version check (which the next step covers).
          sudo GAMETOWN_FORCE=1 GAMETOWN_BASE_URL=http://127.0.0.1:8000 GAMETOWN_VERSION="$TAG" \
            bash install.sh

      - name: Verify the upgrade preserved everything
        run: |
          set -euo pipefail
          systemctl is-active --quiet gametown || { sudo journalctl -u gametown -n 50 --no-pager; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:5187/setup

          sudo test -f /var/lib/gametown/games/library-marker.zip \
            || { echo "::error::the upgrade destroyed the library"; exit 1; }

          sudo ls /var/lib/gametown/ | grep -q 'gametown.db.backup-' \
            || { echo "::error::the upgrade took no database backup"; exit 1; }

      # "The migration runs" and "the migration runs without destroying anything" are different
      # claims, and only the second one matters to someone with games in there.
      - name: Verify the schema upgrade applied and kept the library
        run: |
          set -euo pipefail
          db=/var/lib/gametown/gametown.db

          version="$(sudo sqlite3 "$db" 'SELECT MAX("Version") FROM "SchemaVersion"')"
          [[ "$version" -ge 7 ]] \
            || { echo "::error::the upgrade did not migrate past version 3 (got $version)"; exit 1; }

          # Replayed migrations would show up as a duplicate version row.
          rows="$(sudo sqlite3 "$db" 'SELECT COUNT(*) FROM "SchemaVersion"')"
          distinct="$(sudo sqlite3 "$db" 'SELECT COUNT(DISTINCT "Version") FROM "SchemaVersion"')"
          [[ "$rows" -eq "$distinct" ]] || { echo "::error::a migration was applied twice"; exit 1; }

          # The pre-existing row survived, field by field -- not merely counted. One column per
          # query, which keeps every SQL string single-quotable in the shell. The WHERE clauses are
          # needed now that there are two games: the second one carries the RAWG metadata that
          # migration 007 has to move, and is checked separately below.
          row="$(sudo sqlite3 "$db" <<'SQL'
            SELECT "Title" || '|' || "HowTo" || '|' || "Size" || '|' || "ArchiveSha256"
            FROM "GameTownGame" WHERE "Id" = '11111111-1111-1111-1111-111111111111';
          SQL
          )"
          title="${row%%|*}"; rest="${row#*|}"
          howto="${rest%%|*}"; rest="${rest#*|}"
          size="${rest%%|*}"
          hash="${rest#*|}"

          [[ "$title" == "Existing Game" ]] || { echo "::error::Title changed: $title"; exit 1; }
          [[ "$howto" == "Unzip it" ]]      || { echo "::error::HowTo changed: $howto"; exit 1; }
          [[ "$size"  == "1234.5" ]]        || { echo "::error::Size changed: $size"; exit 1; }
          [[ "$hash"  == "abc123" ]]        || { echo "::error::ArchiveSha256 changed: $hash"; exit 1; }

          # ...and it gained the new columns with their "nobody asked for this" values, rather than
          # being rewritten with a guess.
          boxart="$(sudo sqlite3 "$db" 'SELECT COUNT(*) FROM "GameTownGame" WHERE "BoxArtUrl" IS NOT NULL')"
          [[ "$boxart" -eq 0 ]] || { echo "::error::BoxArtUrl was not added as NULL"; exit 1; }

          guide="$(sudo sqlite3 "$db" 'SELECT COUNT(*) FROM "GameTownGame" WHERE "GuideBaked" != 0')"
          [[ "$guide" -eq 0 ]] || { echo "::error::GuideBaked was not added as 0"; exit 1; }

          # ---------------------------------------------------------------- migration 007
          #
          # The move off RAWG, on a real install rather than a test fixture. An installed library is
          # now the ONLY copy of its own metadata -- RAWG cannot be asked for it again -- so a field
          # dropped here is a field gone from that install permanently.
          # NB every string literal below is single-quoted SQL, reached through a bash here-string.
          # SQLite would ACCEPT "like this" and silently treat an unresolvable identifier as a text
          # literal, which is a documented misfeature and not something to build assertions on.
          meta="$(sudo sqlite3 "$db" <<'SQL'
            SELECT "provider" || '|' || "external_id" || '|' || "name" || '|' || "image"
            FROM "MetadataGames";
          SQL
          )"
          [[ "$meta" == "rawg|3498|Grand Theft Auto V|/media/cover-3498.jpg" ]] \
            || { echo "::error::metadata was not carried across intact: $meta"; exit 1; }

          # The related rows came too. A game that loses its genres renders as a stub, which is data
          # loss that looks like a UI bug.
          genre="$(sudo sqlite3 "$db" 'SELECT COUNT(*) FROM "MetadataGames_Genres"')"
          [[ "$genre" -eq 1 ]] || { echo "::error::genre links were not carried across"; exit 1; }

          # The library entry was re-pointed at the copied row, and the game that never had metadata
          # was left alone rather than given someone else's.
          linked="$(sudo sqlite3 "$db" <<'SQL'
            SELECT "MetadataId" FROM "GameTownGame"
            WHERE "Id" = '22222222-2222-2222-2222-222222222222';
          SQL
          )"
          [[ "$linked" == "3498" ]] || { echo "::error::MetadataId backfill wrong: $linked"; exit 1; }

          orphan="$(sudo sqlite3 "$db" <<'SQL'
            SELECT COUNT(*) FROM "GameTownGame"
            WHERE "Id" = '11111111-1111-1111-1111-111111111111' AND "MetadataId" IS NOT NULL;
          SQL
          )"
          [[ "$orphan" -eq 0 ]] || { echo "::error::a game with no metadata was given some"; exit 1; }

          # The re-hosted image file itself is untouched on disk. The migration moves a PATH between
          # tables; if it ever moved or rewrote the file, every cover in a real library would go blank
          # and every assertion above would still pass.
          sudo test -f /var/lib/gametown/media/cover-3498.jpg \
            || { echo "::error::the upgrade destroyed re-hosted cover art"; exit 1; }

          # The old tables are still there. 007 is additive on purpose -- it keeps the release
          # reversible, and "RAWGGameId" cannot be dropped anyway because a table-level FK names it.
          legacy="$(sudo sqlite3 "$db" 'SELECT COUNT(*) FROM "RAWGGames"')"
          [[ "$legacy" -eq 1 ]] || { echo "::error::the legacy RAWG rows were destroyed"; exit 1; }

          # The quick-add tags are seeded exactly once each.
          quick="$(sudo sqlite3 "$db" 'SELECT COUNT(*) FROM "Tags" WHERE "IsQuickAdd" = 1')"
          [[ "$quick" -eq 4 ]] || { echo "::error::expected 4 quick-add tags, got $quick"; exit 1; }

          # Foreign keys are off unless the connection enables them, so this proves the join table
          # is a real constraint on the running application rather than decoration.
          sudo sqlite3 "$db" 'SELECT 1 FROM "GameTownGame_Tags" LIMIT 1' >/dev/null

          echo "schema=$version quick-add tags=$quick, library intact"

      # The third run is the one people actually make: re-running the install command when nothing has
      # changed. It must cost nothing rather than re-downloading the artifact.
      - name: Verify re-running with no change does nothing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          output="$(sudo GAMETOWN_BASE_URL=http://127.0.0.1:8000 GAMETOWN_VERSION="$TAG" bash install.sh)"
          echo "$output"
          grep -q 'already installed' <<<"$output" \
            || { echo "::error::a no-change re-run did not short-circuit"; exit 1; }
          systemctl is-active --quiet gametown

      - name: Service logs
        if: always()
        run: sudo journalctl -u gametown -n 100 --no-pager || true
